name: audit
# Known vulnerability audit of every dependency. Also runs every Monday, because new flaws are published
# even when no code changes. A failing scheduled run emails the repository owner.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: npm audit of what ships (dashboard and Job HQ). Blocks on any flaw.
        run: |
          (cd web && npm audit --omit=dev --audit-level=low)
          (cd hq && npm audit --omit=dev --audit-level=low)
      - name: npm audit of development tools (reported, not blocking, see osv-scanner.toml)
        continue-on-error: true
        run: |
          (cd web && npm audit --audit-level=low)
          (cd hq && npm audit --audit-level=low)
      - name: pip audit of the collector
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r collector/requirements.txt --progress-spinner off
      - name: OSV Scanner over every lock file (the download is checked against its published fingerprint)
        env:
          OSV_VERSION: "v2.7.1"
          # Run depaudit/scripts/osv_checksum.sh for a new version. Change the version and this fingerprint together.
          OSV_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"
        run: |
          set -euo pipefail
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --config osv-scanner.toml -L web/package-lock.json -L hq/package-lock.json -L collector/requirements.txt
