name: Daily job collection

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC, about 07:00 or 08:00 in Madrid depending on the season
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - name: Install
        run: pip install -e "collector[dev]"
      - name: Test first
        run: cd collector && pytest -q
      - name: Collect
        run: python -m jobtracker.run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
