name: tests
# Runs every test suite on every push and pull request, so a change is never merged unchecked.
# Least privilege: the job only reads the repository. No secret is used or needed.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e "collector[dev]"
      - run: cd collector && pytest -q --cov=jobtracker --cov-fail-under=88
      - run: python3 -m pytest tools/test_repo_rules.py -q
  dashboard:
    runs-on: ubuntu-latest
    env:
      # Placeholders only, so the build can run. They are not secrets and point nowhere.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-not-a-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: cd web && npm ci
      - run: cd web && npx vitest run --coverage
      - run: cd web && npm run build
  hq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: cd hq && npm ci
      - run: cd hq && npx vitest run --coverage
      - run: cd hq && npx tsc --noEmit
      - run: cd hq && npx vite build
